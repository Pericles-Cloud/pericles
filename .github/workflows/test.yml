name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Use the npm major developers use (11). Node 20 ships npm 10, which
      # resolves vitest's optional esbuild peer differently and rejects a
      # lockfile written by npm 11 ("Missing: esbuild@... from lock file"),
      # the failure behind #52 and #86. npm 11 accepts both lockfile forms.
      - run: npm install -g npm@11

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:ci

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/test-results.xml
